    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <script>
      (function() {
        // Clear any leftover Google Translate widget cookies & banners from previous sessions
        try {
          var host = window.location.hostname;
          document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
          document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=' + host + ';';
          document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=.' + host + ';';
        } catch (e) {}

        // Suppress benign Vite dev HMR WebSocket disconnection errors in sandboxed iframe environment
        var origConsoleError = console.error;
        console.error = function() {
          if (arguments.length > 0) {
            var first = arguments[0];
            var msg = (first && (first.message || first.stack || String(first))) || '';
            if (typeof msg === 'string' && msg.indexOf('WebSocket closed without opened') !== -1) {
              return;
            }
          }
          return origConsoleError.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (e && (e.message && e.message.indexOf('WebSocket') !== -1 || e.error && e.error.message && e.error.message.indexOf('WebSocket') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && String(e.reason.message || e.reason).indexOf('WebSocket') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
